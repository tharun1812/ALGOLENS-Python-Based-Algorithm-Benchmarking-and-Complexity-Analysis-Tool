[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algolens"
version = "1.0.0"
description = "Measure what sorting and searching algorithms actually do, and infer their complexity class from the data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "matplotlib>=3.8", "pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100", "pyflakes>=3.2"]

[project.scripts]
algolens = "algolens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
